name: Build 12.41 Gameserver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Build Release x64
        run: msbuild 12.41.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: Travis-12.41-Gameserver
          path: |
            **/x64/Release/**
            **/Release/**
